# Build iOS IPA on GitHub macOS runner (unsigned by default — user re-signs locally).
# Local: place zip in Xcode-Input/ -> double-click run.bat

name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "Xcode-Input/**"
      - "tool/build-config.json"
      - "scripts/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:
    inputs:
      signed_build:
        description: Sign with p12 secrets (optional)
        type: boolean
        default: false
      upload_appstore:
        description: Upload to App Store Connect (requires signed build)
        type: boolean
        default: false

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Load build config
        run: bash scripts/load-build-config.sh tool/build-config.json

      - name: Download Xcode zip (Release)
        if: env.XCODE_ZIP_RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$XCODE_ZIP")"
          echo "Downloading zip from release $XCODE_ZIP_RELEASE ..."
          gh release download "$XCODE_ZIP_RELEASE" \
            --repo "${{ github.repository }}" \
            --pattern "$(basename "$XCODE_ZIP")" \
            --dir "$(dirname "$XCODE_ZIP")"
          test -s "$XCODE_ZIP" || { echo "Downloaded zip is empty"; exit 1; }

      - name: Extract Xcode project
        run: |
          if [ ! -d "$XCODE_SRC/$XCODE_PROJECT" ]; then
            echo "Extracting $XCODE_ZIP ..."
            unzip -q -o "$XCODE_ZIP" -d Xcode-Input/extracted
          else
            echo "Xcode source already present at $XCODE_SRC"
          fi
          test -d "$XCODE_SRC/$XCODE_PROJECT" || { echo "Xcode project not found at $XCODE_SRC/$XCODE_PROJECT"; exit 1; }
          # Zip from Windows often drops execute bits on shell scripts.
          find "$XCODE_SRC" -type f -name "*.sh" -exec chmod +x {} +

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install signing assets (optional)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNED_BUILD_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_build || 'false' }}
        run: |
          if [ "$SIGNED_BUILD_INPUT" = "true" ] && [ -n "${BUILD_CERTIFICATE_BASE64}" ]; then
            bash scripts/setup-signing.sh
            echo "UNSIGNED_BUILD=0" >> "$GITHUB_ENV"
            echo "Signed build enabled."
          else
            echo "UNSIGNED_BUILD=1" >> "$GITHUB_ENV"
            echo "Unsigned build — IPA for user re-signing (no p12 required)."
          fi

      - name: Build and pack IPA (Payload)
        working-directory: ${{ env.XCODE_SRC }}
        env:
          XCODE_PROJECT: ${{ env.XCODE_PROJECT }}
          SCHEME: ${{ env.SCHEME }}
          APP_NAME: ${{ env.APP_NAME }}
          UNSIGNED_BUILD: ${{ env.UNSIGNED_BUILD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
          OUTPUT_IPA: ${{ github.workspace }}/${{ env.OUTPUT_IPA }}
        run: bash "${{ github.workspace }}/scripts/build-and-pack-ipa-payload.sh"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_IPA }}
          retention-days: 14

      - name: Upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && inputs.upload_appstore == true && inputs.signed_build == true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IPA_FILE: ${{ github.workspace }}/${{ env.OUTPUT_IPA }}
        run: bash scripts/upload-appstore.sh
